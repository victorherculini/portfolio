name: Sync GitHub Portfolio Data

on:
  schedule:
    # Runs daily at 06:00 UTC (03:00 BRT)
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch GitHub profile, repositories and activity
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USER: victorherculini
        run: |
          node -e '
          const fs = require("fs");
          const path = require("path");

          async function fetchJson(url) {
            const res = await fetch(url, {
              headers: {
                "User-Agent": "victorherculini-portfolio-sync",
                "Accept": "application/vnd.github+json",
                ...(process.env.GH_TOKEN ? { Authorization: `Bearer ${process.env.GH_TOKEN}` } : {})
              }
            });
            if (!res.ok) throw new Error(`HTTP ${res.status} on ${url}`);
            return res.json();
          }

          (async () => {
            const username = process.env.GH_USER;
            const [user, repos, events] = await Promise.all([
              fetchJson(`https://api.github.com/users/${username}`),
              fetchJson(`https://api.github.com/users/${username}/repos?per_page=100&sort=updated`),
              fetchJson(`https://api.github.com/users/${username}/events/public?per_page=20`)
            ]);

            const owned = repos.filter(r => !r.fork);
            const totalStars = owned.reduce((acc, r) => acc + (r.stargazers_count || 0), 0);
            const languages = {};
            for (const r of owned) {
              if (r.language) languages[r.language] = (languages[r.language] || 0) + 1;
            }

            const lastPush = events.find(e => e.type === "PushEvent");
            const snapshot = {
              synced_at: new Date().toISOString(),
              profile: {
                login: user.login,
                name: user.name,
                bio: user.bio,
                location: user.location,
                avatar_url: user.avatar_url,
                html_url: user.html_url,
                public_repos: user.public_repos,
                followers: user.followers,
                following: user.following,
                total_stars: totalStars,
                created_at: user.created_at
              },
              last_push: lastPush ? {
                repo: lastPush.repo?.name,
                created_at: lastPush.created_at
              } : null,
              languages,
              repos: owned.map(r => ({
                name: r.name,
                description: r.description,
                language: r.language,
                stargazers_count: r.stargazers_count,
                forks_count: r.forks_count,
                html_url: r.html_url,
                homepage: r.homepage,
                topics: r.topics || [],
                updated_at: r.updated_at,
                pushed_at: r.pushed_at,
                created_at: r.created_at
              }))
            };

            fs.mkdirSync("data", { recursive: true });
            fs.writeFileSync(path.join("data", "github-snapshot.json"), JSON.stringify(snapshot, null, 2) + "\n");
            console.log(`Synced ${snapshot.repos.length} repos (${totalStars} stars).`);
          })().catch(err => {
            console.error(err);
            process.exit(1);
          });
          '

      - name: Commit updated snapshot if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [[ -n "$(git status --porcelain data/github-snapshot.json)" ]]; then
            git add data/github-snapshot.json
            git commit -m "chore(sync): update GitHub portfolio snapshot"
            git push
          else
            echo "No changes in GitHub snapshot."
          fi
